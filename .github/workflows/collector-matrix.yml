name: collector matrix

# Weekly, on demand, and before each release (release.yml). Results: docs/082-Collector-OS-support.md

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  workflow_call:

env:
  NODE_VERSION: 24

permissions:
  contents: read

jobs:
  script:
    name: script on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - almalinux:9
          - almalinux:10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install test dependencies
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -q && apt-get install -yq --no-install-recommends git ca-certificates
          else
            dnf -y install git diffutils findutils hostname
          fi
      - uses: actions/checkout@v7
      - name: Tool versions
        run: |
          bash --version | head -n 1
          awk -W version 2>/dev/null | head -n 1 || awk --version | head -n 1
          grep --version | head -n 1
          sed --version | head -n 1
      - name: Test
        run: bash host/test/run.sh --plain

  vm:
    name: VM ${{ matrix.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # expect-failed: sources whose command fails there. OpenZFS < 2.3 has no -j, and the
      # VMs have no vdev_id.conf. A change either way fails the job; update docs/082.
      matrix:
        include:
          - distro: debian-12
            expect-failed: vdev-id-conf
          - distro: debian-13
            expect-failed: vdev-id-conf
          - distro: proxmox-9
            expect-failed: vdev-id-conf
          - distro: ubuntu-22.04
            expect-failed: zpool-status,zpool-list,zfs-list,zfs-snapshots,vdev-id-conf
          - distro: ubuntu-24.04
            expect-failed: zpool-status,zpool-list,zfs-list,zfs-snapshots,vdev-id-conf
          - distro: ubuntu-26.04
            expect-failed: vdev-id-conf
          - distro: almalinux-9
            expect-failed: zpool-status,zpool-list,zfs-list,zfs-snapshots,vdev-id-conf
          - distro: almalinux-10
            expect-failed: zpool-status,zpool-list,zfs-list,zfs-snapshots,vdev-id-conf
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-utils xorriso
      - name: Capture in VM
        run: host/test/matrix/vm.sh ${{ matrix.distro }} out/${{ matrix.distro }}
      - uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Prepare Nuxt types
        run: pnpm nuxt prepare
      - name: Parse capture
        run: |
          pnpm exec tsx --tsconfig .nuxt/tsconfig.server.json bin/parse-capture.ts \
            --label ${{ matrix.distro }} --expect-failed ${{ matrix.expect-failed }} \
            out/${{ matrix.distro }}/collect.txt \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-${{ matrix.distro }}
          path: out/${{ matrix.distro }}
          if-no-files-found: ignore
